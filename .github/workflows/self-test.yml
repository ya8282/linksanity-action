name: Self-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  broken-fixture:
    name: Broken fixture fails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: scan
        uses: ./
        continue-on-error: true
        with:
          paths: test-docs/broken/
          artifact-name: linksanity-results-broken-fixture
      - name: Assert broken link was detected
        run: |
          test "${{ steps.scan.outcome }}" = "failure"
          test "${{ steps.scan.outputs.broken-count }}" -ge 1

  clean-fixture:
    name: Clean fixture passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: scan
        uses: ./
        with:
          paths: test-docs/clean/
          artifact-name: linksanity-results-clean-fixture
      - name: Assert no broken links were detected
        run: |
          test "${{ steps.scan.outcome }}" = "success"
          test "${{ steps.scan.outputs.broken-count }}" -eq 0

  js-domains-without-browser-fails-fast:
    name: --js-domains without browser fails fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: scan
        uses: ./
        continue-on-error: true
        with:
          paths: test-docs/clean/
          args: "--js-domains foo.txt"
          upload-results: "false"
      - name: Assert the guard rejected --js-domains without browser
        run: |
          test "${{ steps.scan.outcome }}" = "failure"

  baselined-fixture:
    name: Baselined breakage still passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: scan
        uses: ./
        with:
          paths: test-docs/baselined/
          baseline: test-docs/baselined/baseline.json
          artifact-name: linksanity-results-baselined-fixture
      - name: Assert the pre-baked baseline absorbed the known-broken link
        run: |
          test "${{ steps.scan.outcome }}" = "success"
          test "${{ steps.scan.outputs.broken-count }}" -eq 0

  missing-baseline:
    name: Missing baseline file fails with the expected error
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Confirm the baseline fixture path is genuinely absent
        run: test ! -e test-docs/baselined/missing.json
      - id: scan
        uses: ./
        continue-on-error: true
        with:
          paths: test-docs/clean/
          baseline: test-docs/baselined/missing.json
          upload-results: "false"
      - name: Assert the action failed on the missing baseline
        run: |
          test "${{ steps.scan.outcome }}" = "failure"
