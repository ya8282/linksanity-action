name: Self-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  broken-fixture:
    name: Broken fixture fails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: scan
        uses: ./
        continue-on-error: true
        with:
          paths: test-docs/broken/
          artifact-name: linksanity-results-broken-fixture
      - name: Assert broken link was detected
        run: |
          test "${{ steps.scan.outcome }}" = "failure"
          test "${{ steps.scan.outputs.broken-count }}" -ge 1
      - name: "Assert the ::error:: annotation includes file=/line= (linksanity-g79)"
        env:
          # Passed through env, not spliced into the script body: annotations
          # are built from scanned document content (urls/errors), so this
          # text is attacker-influenced and must never be interpolated where
          # bash would re-parse it.
          ANNOTATIONS: ${{ steps.scan.outputs.annotations }}
        run: |
          # The previous step only proves a link was detected as broken, not
          # that its ::error:: annotation carries file=/line=. action.yml
          # builds those properties with the same jq expressions as the
          # ::warning:: path tightened in linksanity-3pq; this closes the
          # identical gap on the ::error:: side, so the job goes red if
          # file=/line= are ever dropped from that jq pass.
          #
          # -E (not -F) because this pattern needs [0-9]+; the literal "."
          # in the filename is escaped so it can't match any character, and
          # the fixture path has no other regex metacharacters. The line
          # number itself isn't pinned since the fixture may grow lines.
          # This fixture (test-docs/broken/broken.md) has exactly one broken
          # link, so a single combined grep cannot ambiguously match a
          # different link's line -- unlike a fixture with more than one
          # failing link, where a URL grep split from the shape grep could
          # in principle match two different lines (see linksanity-g79).
          test -n "$ANNOTATIONS"
          printf '%s\n' "$ANNOTATIONS" | grep -E -q -- '::error file=test-docs/broken/broken\.md,line=[0-9]+::'

  clean-fixture:
    name: Clean fixture passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: scan
        uses: ./
        with:
          paths: test-docs/clean/
          artifact-name: linksanity-results-clean-fixture
      - name: Assert no broken links were detected
        run: |
          test "${{ steps.scan.outcome }}" = "success"
          test "${{ steps.scan.outputs.broken-count }}" -eq 0

  too-many-redirects-fixture:
    name: Too-many-redirects-only fixture still fails and is counted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: scan
        uses: ./
        continue-on-error: true
        with:
          paths: test-docs/too-many-redirects/
          args: "--max-redirects 0"
          artifact-name: linksanity-results-too-many-redirects-fixture
      - name: Assert a too_many_redirects-only failure still fails the job and is counted
        run: |
          test "${{ steps.scan.outcome }}" = "failure"
          test "${{ steps.scan.outputs.broken-count }}" -ge 1
          RESULTS="${{ steps.scan.outputs.results-file }}"
          test "$(jq '[.[] | select(.status != "too_many_redirects")] | length' "$RESULTS")" -eq 0
      - name: Assert the redirect-loop link is present in the real results, not silently dropped (linksanity-jx1)
        run: |
          RESULTS="${{ steps.scan.outputs.results-file }}"
          url=$(jq -r '[.[] | select(.status=="too_many_redirects")][0].url' "$RESULTS")
          test -n "$url"
          test "$url" != "null"
      - name: Assert the too_many_redirects annotation uses the action's real emitted label (linksanity-jx1, linksanity-ypf)
        env:
          # Passed through env, not spliced into the script body: annotations
          # are built from scanned document content (urls/errors), so this
          # text is attacker-influenced and must never be interpolated where
          # bash would re-parse it.
          ANNOTATIONS: ${{ steps.scan.outputs.annotations }}
        run: |
          # ANNOTATIONS carries the exact ::error:: lines action.yml built and
          # printed for this run (see the `annotations` output) -- not a
          # reimplementation of its jq. If action.yml's too_many_redirects
          # label ever changes, this assertion breaks because the captured
          # text itself changes, not because a second copy of the label logic
          # drifted from it.
          #
          # A plain substring match on "redirect loop" also matches a stale
          # or regressed label such as "too many redirects (redirect loop)"
          # or "redirect loop detected" (both contain that substring), so pin
          # the exact label instead: it must be followed immediately by
          # either end of line or this record's own detail text, queried
          # straight from the results file (not action.yml's jq), so nothing
          # that varies with --max-redirects is hardcoded here.
          test -n "$ANNOTATIONS"
          RESULTS="${{ steps.scan.outputs.results-file }}"
          record=$(jq -c '[.[] | select(.status=="too_many_redirects")][0]' "$RESULTS")
          url=$(jq -r '.url' <<<"$record")
          detail=$(jq -r '(.http_code // .error // "") | tostring' <<<"$record")
          if [ -z "$detail" ]; then
            echo "::error::too_many_redirects record for '$url' has neither http_code nor error, so this assertion has no detail text to anchor the expected annotation to (see linksanity-1ie). The fixture must have changed shape -- check test-docs/too-many-redirects/ and action.yml's too_many_redirects annotation logic." >&2
            exit 1
          fi
          expected="$url — redirect loop $detail"
          printf '%s\n' "$ANNOTATIONS" | grep -F -q -- "$expected"

  too-many-redirects-fixture-not-failing:
    name: Too-many-redirects-only fixture passes and warns when fail-on-redirect-loop is false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: scan
        uses: ./
        with:
          paths: test-docs/too-many-redirects/
          args: "--max-redirects 0"
          fail-on-redirect-loop: "false"
          artifact-name: linksanity-results-too-many-redirects-fixture-not-failing
      - name: Assert a too_many_redirects-only run succeeds and is not counted when fail-on-redirect-loop is false (linksanity-9tw)
        run: |
          test "${{ steps.scan.outcome }}" = "success"
          test "${{ steps.scan.outputs.broken-count }}" -eq 0
          RESULTS="${{ steps.scan.outputs.results-file }}"
          test "$(jq '[.[] | select(.status=="too_many_redirects")] | length' "$RESULTS")" -ge 1
      - name: Assert the redirect loop was surfaced as a warning, not an error (linksanity-9tw)
        run: |
          # No ::error:: annotation is built when broken-count is 0 (the
          # `annotations` output is only ever written inside that branch), so
          # its absence here is the direct, output-based proof that this
          # redirect loop was not treated as an ::error::. Combined with the
          # previous step's proof that the record is still present in the
          # real results file (not silently dropped), the only place left for
          # it to have surfaced is the ::warning:: path added for this input.
          test -z "${{ steps.scan.outputs.annotations }}"
      - name: Assert the warning annotation text was actually printed, not just absent from annotations (linksanity-rqd)
        env:
          # Passed through env, not spliced into the script body: warnings
          # are built from scanned document content (urls/errors), so this
          # text is attacker-influenced and must never be interpolated where
          # bash would re-parse it.
          WARNINGS: ${{ steps.scan.outputs.warnings }}
        run: |
          # The previous step only proves a negative (no ::error:: was
          # built). This proves the positive: the `warnings` output actually
          # contains the ::warning:: line for this redirect loop, so the job
          # would go red if the ::warning:: jq pass in action.yml were ever
          # deleted (it would leave WARNINGS empty and this grep would fail).
          test -n "$WARNINGS"
          RESULTS="${{ steps.scan.outputs.results-file }}"
          url=$(jq -r '[.[] | select(.status=="too_many_redirects")][0].url' "$RESULTS")
          test -n "$url"
          test "$url" != "null"
          printf '%s\n' "$WARNINGS" | grep -F -q -- "::warning"
          printf '%s\n' "$WARNINGS" | grep -F -q -- "$url"
          # The two greps above only catch deletion of the whole jq pass.
          # They would stay green even if the file=/line= properties (added
          # alongside the ::error:: path) were dropped from the ::warning::
          # line, which would silently stop the warning from attaching to
          # the source line in the GitHub UI. Assert the full annotation
          # shape against the real fixture path instead of just the marker.
          # -E (not -F) because this pattern needs [0-9]+; the literal "."
          # in the filename is escaped so it can't match any character, and
          # the fixture path has no other regex metacharacters. The line
          # number itself isn't pinned since the fixture may grow lines.
          printf '%s\n' "$WARNINGS" | grep -E -q -- '::warning file=test-docs/too-many-redirects/redirect\.md,line=[0-9]+::'

  js-domains-without-browser-fails-fast:
    name: --js-domains without browser fails fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: scan
        uses: ./
        continue-on-error: true
        with:
          paths: test-docs/clean/
          args: "--js-domains foo.txt"
          upload-results: "false"
      - name: Assert the guard rejected --js-domains without browser
        run: |
          test "${{ steps.scan.outcome }}" = "failure"

  baselined-fixture:
    name: Baselined breakage still passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: scan
        uses: ./
        with:
          paths: test-docs/baselined/
          baseline: test-docs/baselined/baseline.json
          artifact-name: linksanity-results-baselined-fixture
      - name: Assert the pre-baked baseline absorbed the known-broken link
        run: |
          test "${{ steps.scan.outcome }}" = "success"
          test "${{ steps.scan.outputs.broken-count }}" -eq 0

  missing-baseline:
    name: Missing baseline file fails with the expected error
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Confirm the baseline fixture path is genuinely absent
        run: test ! -e test-docs/baselined/missing.json
      - id: scan
        uses: ./
        continue-on-error: true
        with:
          paths: test-docs/clean/
          baseline: test-docs/baselined/missing.json
          upload-results: "false"
      - name: Assert the action failed on the missing baseline
        run: |
          test "${{ steps.scan.outcome }}" = "failure"

  report-write-failure-still-fails:
    name: A results file with a subsequent CLI failure still fails the job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: scan
        uses: ./
        continue-on-error: true
        with:
          paths: test-docs/clean/
          args: "--report /nonexistent-linksanity-selftest-dir-xyz/report.md"
          artifact-name: linksanity-results-report-write-failure
      - name: Assert a results file with no failing links but a later CLI failure (unwritable --report path) still fails the job (linksanity-9tw)
        run: |
          # linksanity writes --output before it attempts --report, so the
          # results file exists and is valid (no failing links) here even
          # though the CLI itself goes on to exit 2 for the unwritable
          # --report path. This pins the regression where a present, valid
          # results file made the action's own broken-count policy override
          # ANY CLI exit code -- including this one -- down to success.
          test "${{ steps.scan.outcome }}" = "failure"
          RESULTS="${{ steps.scan.outputs.results-file }}"
          test -f "$RESULTS"
          test "$(jq 'length' "$RESULTS")" -ge 1
          test "${{ steps.scan.outputs.broken-count }}" -eq 0

  version-pin-consistency:
    name: version input default matches linksanity's _ACTION_PINNED_VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # Pinned to linksanity main, not a release: an unrelated linksanity commit
      # can redden this job with nothing changed here. Deliberate -- see linksanity-v1p.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with: {repository: ya8282/linksanity, ref: main, path: _linksanity-src}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - name: Compare action.yml's pin against linksanity/init.py's _ACTION_PINNED_VERSION
        run: |
          python3 - <<'PYEOF'
          import ast, yaml
          expected = yaml.safe_load(open("action.yml"))["inputs"]["version"]["default"]
          src = "_linksanity-src/linksanity/init.py"
          try:
              tree = ast.parse(open(src).read(), filename=src)
          except SyntaxError as e:
              print(f"::error::failed to parse {src}: {e}")
              raise SystemExit(1)
          installed = None
          for node in ast.walk(tree):
              if not isinstance(node, (ast.Assign, ast.AnnAssign)):
                  continue
              for t in getattr(node, "targets", None) or [node.target]:
                  if isinstance(t, ast.Name) and t.id == "_ACTION_PINNED_VERSION" and node.value is not None:
                      try:
                          installed = ast.literal_eval(node.value)
                      except ValueError as e:
                          print(f"::error::_ACTION_PINNED_VERSION in {src} is not a literal constant: {e}")
                          raise SystemExit(1)
          if installed is None:
              print("::warning::_ACTION_PINNED_VERSION is absent from linksanity's main (linksanity/init.py) or has no value, so this check is not yet enforcing anything. It will begin enforcing once that constant lands on main with a literal value.")
              raise SystemExit(0)
          if installed != expected:
              print(f"::error::action.yml's `version` input default is '{expected}' (action-repo/action.yml), but linksanity/init.py's _ACTION_PINNED_VERSION is '{installed}' (linksanity/init.py). Update whichever is stale so they agree.")
              raise SystemExit(1)
          print(f"OK: action.yml and linksanity/init.py agree on {expected}")
          PYEOF
