name: Self-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  broken-fixture:
    name: Broken fixture fails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: scan
        uses: ./
        continue-on-error: true
        with:
          paths: test-docs/broken/
          artifact-name: linksanity-results-broken-fixture
      - name: Assert broken link was detected
        run: |
          test "${{ steps.scan.outcome }}" = "failure"
          test "${{ steps.scan.outputs.broken-count }}" -ge 1

  clean-fixture:
    name: Clean fixture passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: scan
        uses: ./
        with:
          paths: test-docs/clean/
          artifact-name: linksanity-results-clean-fixture
      - name: Assert no broken links were detected
        run: |
          test "${{ steps.scan.outcome }}" = "success"
          test "${{ steps.scan.outputs.broken-count }}" -eq 0

  too-many-redirects-fixture:
    name: Too-many-redirects-only fixture still fails and is counted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: scan
        uses: ./
        continue-on-error: true
        with:
          paths: test-docs/too-many-redirects/
          args: "--max-redirects 0"
          artifact-name: linksanity-results-too-many-redirects-fixture
      - name: Assert a too_many_redirects-only failure still fails the job and is counted
        run: |
          test "${{ steps.scan.outcome }}" = "failure"
          test "${{ steps.scan.outputs.broken-count }}" -ge 1
          RESULTS="${{ steps.scan.outputs.results-file }}"
          test "$(jq '[.[] | select(.status != "too_many_redirects")] | length' "$RESULTS")" -eq 0
      - name: Assert the redirect-loop link is present in the real results, not silently dropped (linksanity-jx1)
        run: |
          RESULTS="${{ steps.scan.outputs.results-file }}"
          url=$(jq -r '[.[] | select(.status=="too_many_redirects")][0].url' "$RESULTS")
          test -n "$url"
          test "$url" != "null"
      - name: Assert the too_many_redirects annotation uses the action's real emitted label (linksanity-jx1, linksanity-ypf)
        env:
          # Passed through env, not spliced into the script body: annotations
          # are built from scanned document content (urls/errors), so this
          # text is attacker-influenced and must never be interpolated where
          # bash would re-parse it.
          ANNOTATIONS: ${{ steps.scan.outputs.annotations }}
        run: |
          # ANNOTATIONS carries the exact ::error:: lines action.yml built and
          # printed for this run (see the `annotations` output) -- not a
          # reimplementation of its jq. If action.yml's too_many_redirects
          # label ever changes, this assertion breaks because the captured
          # text itself changes, not because a second copy of the label logic
          # drifted from it.
          #
          # A plain substring match on "redirect loop" also matches a stale
          # or regressed label such as "too many redirects (redirect loop)"
          # or "redirect loop detected" (both contain that substring), so pin
          # the exact label instead: it must be followed immediately by
          # either end of line or this record's own detail text, queried
          # straight from the results file (not action.yml's jq), so nothing
          # that varies with --max-redirects is hardcoded here.
          test -n "$ANNOTATIONS"
          RESULTS="${{ steps.scan.outputs.results-file }}"
          record=$(jq -c '[.[] | select(.status=="too_many_redirects")][0]' "$RESULTS")
          url=$(jq -r '.url' <<<"$record")
          detail=$(jq -r '(.http_code // .error // "") | tostring' <<<"$record")
          if [ -z "$detail" ]; then
            echo "::error::too_many_redirects record for '$url' has neither http_code nor error, so this assertion has no detail text to anchor the expected annotation to (see linksanity-1ie). The fixture must have changed shape -- check test-docs/too-many-redirects/ and action.yml's too_many_redirects annotation logic." >&2
            exit 1
          fi
          expected="$url — redirect loop $detail"
          printf '%s\n' "$ANNOTATIONS" | grep -F -q -- "$expected"

  js-domains-without-browser-fails-fast:
    name: --js-domains without browser fails fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: scan
        uses: ./
        continue-on-error: true
        with:
          paths: test-docs/clean/
          args: "--js-domains foo.txt"
          upload-results: "false"
      - name: Assert the guard rejected --js-domains without browser
        run: |
          test "${{ steps.scan.outcome }}" = "failure"

  baselined-fixture:
    name: Baselined breakage still passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: scan
        uses: ./
        with:
          paths: test-docs/baselined/
          baseline: test-docs/baselined/baseline.json
          artifact-name: linksanity-results-baselined-fixture
      - name: Assert the pre-baked baseline absorbed the known-broken link
        run: |
          test "${{ steps.scan.outcome }}" = "success"
          test "${{ steps.scan.outputs.broken-count }}" -eq 0

  missing-baseline:
    name: Missing baseline file fails with the expected error
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Confirm the baseline fixture path is genuinely absent
        run: test ! -e test-docs/baselined/missing.json
      - id: scan
        uses: ./
        continue-on-error: true
        with:
          paths: test-docs/clean/
          baseline: test-docs/baselined/missing.json
          upload-results: "false"
      - name: Assert the action failed on the missing baseline
        run: |
          test "${{ steps.scan.outcome }}" = "failure"

  version-pin-consistency:
    name: version input default matches linksanity's _ACTION_PINNED_VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with: {repository: ya8282/linksanity, ref: main, path: _linksanity-src}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - name: Compare action.yml's pin against linksanity/init.py's _ACTION_PINNED_VERSION
        run: |
          python3 - <<'PYEOF'
          import ast, yaml
          expected = yaml.safe_load(open("action.yml"))["inputs"]["version"]["default"]
          src = "_linksanity-src/linksanity/init.py"
          tree = ast.parse(open(src).read(), filename=src)
          installed = None
          for node in ast.walk(tree):
              if isinstance(node, ast.Assign):
                  for t in node.targets:
                      if isinstance(t, ast.Name) and t.id == "_ACTION_PINNED_VERSION":
                          installed = ast.literal_eval(node.value)
          if installed is None:
              print("::warning::_ACTION_PINNED_VERSION is absent from linksanity's main (linksanity/init.py), so this check is not yet enforcing anything. It will begin enforcing once that constant lands on main.")
              raise SystemExit(0)
          if installed != expected:
              print(f"::error::action.yml's `version` input default is '{expected}' (action-repo/action.yml), but linksanity/init.py's _ACTION_PINNED_VERSION is '{installed}' (linksanity/init.py). Update whichever is stale so they agree.")
              raise SystemExit(1)
          print(f"OK: action.yml and linksanity/init.py agree on {expected}")
          PYEOF
